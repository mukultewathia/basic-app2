<div class="challenge-detail-page">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="skeleton-header">
      <div class="skeleton-title"></div>
      <div class="skeleton-subtitle"></div>
      <div class="skeleton-actions"></div>
    </div>
    <div class="skeleton-grid">
      <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]">
        <div class="skeleton-cell" *ngFor="let j of [1,2,3,4,5]"></div>
      </div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="error-state">
    <div class="error-content">
      <h3>Unable to load challenge</h3>
      <p>{{ error }}</p>
      <button class="btn btn-primary" (click)="loadChallenge()">Try Again</button>
      <button class="btn btn-secondary" routerLink="/metrics-app/challenges">Back to Challenges</button>
    </div>
  </div>

  <!-- Challenge Detail Content -->
  <div *ngIf="!isLoading && !error && challenge" class="challenge-content">
    <!-- Challenge Header & Retrospective -->
    <app-challenge-header
      [challenge]="challenge"
      [isHeaderExpanded]="isHeaderExpanded"
      [isAnalyzing]="isAnalyzing"
      [showMiniMatrix]="showMiniMatrix"
      [habits]="habits"
      [last7DaysDates]="last7DaysDates"
      [cells]="cells"
      [(retrospectiveText)]="retrospectiveText"
      [isEditingRetrospective]="isEditingRetrospective"
      (toggleHeaderExpansion)="toggleHeaderExpansion()"
      (toggleMiniMatrix)="toggleMiniMatrix()"
      (closeMiniMatrix)="closeMiniMatrix()"
      (modifyChallenge)="showModifyChallengeDialog()"
      (analyzeChallenge)="analyzeChallenge()"
      (startEditingRetrospective)="startEditingRetrospective()"
      (cancelEditingRetrospective)="cancelEditingRetrospective()"
      (saveRetrospective)="saveRetrospective()">
    </app-challenge-header>

    <!-- Desktop Grid View -->
    <app-challenge-desktop-grid
      [dates]="dates"
      [habits]="habits"
      [cells]="cells"
      [notes]="notes"
      (habitCellClick)="onHabitCellClick($event)"
      (notesCellClick)="onNotesCellClick($event)">
    </app-challenge-desktop-grid>

    <!-- Mobile View: Daily Habit Logger & Date Picker Strip -->
    <app-challenge-mobile-view
      [dates]="dates"
      [habits]="habits"
      [cells]="cells"
      [selectedMobileDate]="selectedMobileDate"
      [animatingHabits]="animatingHabits"
      [notesText]="selectedMobileDate ? (notes.get(selectedMobileDate.date)?.noteText || '') : ''"
      (selectDate)="selectMobileDate($event)"
      (selectPreviousDate)="selectPreviousMobileDate()"
      (selectNextDate)="selectNextMobileDate()"
      (toggleHabit)="toggleMobileHabit($event)"
      (notesClick)="onNotesCellClick($event)">
    </app-challenge-mobile-view>
  </div>

  <!-- Notes Dialog -->
  <app-note-dialog [date]="selectedNoteDate" [isVisible]="showNoteDialog" [initialNote]="selectedNoteText"
    (close)="onNoteDialogClose()" (save)="onNoteDialogSave($event)">
  </app-note-dialog>

  <!-- Habit Confirmation Dialog -->
  <app-habit-confirmation [isVisible]="showHabitConfirmation" [habitName]="confirmationHabitName"
    [date]="confirmationDate" (confirm)="onHabitConfirmationConfirm()" (cancel)="onHabitConfirmationCancel()"
    (close)="closeHabitConfirmation()">
  </app-habit-confirmation>

  <!-- Confirmation Dialog -->
  <app-confirmation-dialog [isVisible]="showConfirmationDialog" [data]="confirmationDialogData"
    [isLoading]="isRemovingHabit" (confirm)="onConfirmationDialogConfirm()" (cancel)="onConfirmationDialogCancel()"
    (close)="onConfirmationDialogClose()">
  </app-confirmation-dialog>

  <!-- Challenge Modify Dialog -->
  <app-challenge-modify-dialog
    [isVisible]="showHabitSelectionDialog"
    [challenge]="challenge"
    [challengeUpdateForm]="challengeUpdateForm"
    [availableHabits]="availableHabits"
    [isUpdatingChallenge]="isUpdatingChallenge"
    [isRemovingHabit]="isRemovingHabit"
    (close)="closeHabitSelectionDialog()"
    (updateChallenge)="updateChallenge()"
    (removeHabit)="removeHabit($event)"
    (toggleHabitSelection)="toggleHabitSelection($event)">
  </app-challenge-modify-dialog>

  <!-- Analysis Result Dialog -->
  <div *ngIf="showAnalysisDialog" class="modal-overlay" (click)="closeAnalysisDialog()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <h3>Challenge Analysis</h3>
        </div>
        <button class="close-btn" (click)="closeAnalysisDialog()">
          <span class="close-icon">×</span>
        </button>
      </div>
      <div class="modal-body">
        <markdown class="analysis-text" [data]="analysisResult"></markdown>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" (click)="closeAnalysisDialog()">Close</button>
      </div>
    </div>
  </div>
</div>
