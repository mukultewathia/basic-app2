@if (isVisible) {
  <div class="note-dialog-overlay" (click)="onOverlayClick($event)">
    <div class="note-dialog" (click)="$event.stopPropagation()">
      <div class="note-dialog-header">
        <h3>Notes for {{ formatDate(date) }}</h3>
        <button 
          class="close-button" 
          (click)="onClose()"
          aria-label="Close notes dialog">
          ×
        </button>
      </div>
      
      <div class="note-dialog-content">
        <!-- Add Log Action Trigger & Expandable Section -->
        <div class="add-log-container">
          <button 
            type="button" 
            class="btn btn-add-log" 
            (click)="toggleAddLog()">
            <span>{{ showAddLog ? '➖ Close Log Form' : '➕ Add Log Entry' }}</span>
          </button>

          <div *ngIf="showAddLog" class="add-log-card">
            <div class="log-input-header">
              <label class="log-time-label">
                <span>Time:</span>
                <input type="time" [(ngModel)]="logTime" class="log-time-input">
              </label>
            </div>
            <textarea
              [(ngModel)]="logDraft"
              placeholder="Type your log entry here..."
              rows="2"
              class="log-draft-textarea">
            </textarea>
            <div class="log-card-actions">
              <button 
                type="button" 
                class="btn btn-secondary btn-sm" 
                (click)="toggleAddLog()">
                Cancel
              </button>
              <button 
                type="button" 
                class="btn btn-primary btn-sm" 
                (click)="addLogToNote()"
                [disabled]="!logDraft.trim()">
                Prepend Log
              </button>
            </div>
          </div>
        </div>

        <textarea
          [(ngModel)]="noteText"
          placeholder="Add your notes for this day..."
          rows="6"
          class="note-textarea"
          (keydown.ctrl.enter)="onSave()"
          (keydown.meta.enter)="onSave()"
          #noteInput>
        </textarea>
      </div>
      
      <div class="note-dialog-actions">
        <button 
          class="btn btn-secondary" 
          (click)="onClose()"
          [disabled]="isSaving">
          Cancel
        </button>
        <button 
          class="btn btn-primary" 
          (click)="onSave()"
          [disabled]="isSaving">
          {{ isSaving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </div>
  </div>
}
